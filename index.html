<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pixel Adventure</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
  <link rel="apple-touch-icon" href="index.apple-touch-icon.png" />

  <script data-goatcounter="https://ayman-mohamed.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #14121a;
      --panel: #1f1b26;
      --accent: #f4c15c;
      --text: #e7e2d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, 'Segoe UI', sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 12px;
      gap: 48px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(16px, 4vw, 32px);
      color: var(--accent);
      text-shadow: 3px 3px 0 rgba(0, 0, 0, .5);
      margin: 0;
      letter-spacing: 1px;
    }

    #game-frame {
      background: var(--panel);
      border: 4px solid var(--accent);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
    }

    #canvas-wrapper {
      position: relative;
      display: inline-block;
      line-height: 0;
    }

    #canvas-wrapper:fullscreen,
    #canvas-wrapper:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      display: block;
      image-rendering: pixelated;
      background: var(--bg);
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--panel);
    }

    #loading span {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--accent);
    }

    #progress-track {
      width: 220px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .2s linear;
    }

    #fullscreen-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 38px;
      height: 38px;
      padding: 0;
      background: rgba(20, 18, 26, 0.55);
      border: 1px solid rgba(244, 193, 92, 0.6);
      border-radius: 50%;
      color: var(--accent);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      display: none;
      backdrop-filter: blur(2px);
    }

    #fullscreen-btn:hover {
      background: rgba(20, 18, 26, 0.8);
    }

    footer {
      font-size: 11px;
      opacity: .55;
      padding: 6px 0 16px;
    }

    @media (pointer: coarse) and (orientation: landscape) and (max-height: 500px) {
      body {
        padding: 4px;
        gap: 0;
      }

      h1,
      footer {
        display: none;
      }
    }
  </style>
</head>

<body>
  <h1>Pixel Adventure</h1>

  <div id="game-frame">
    <div id="canvas-wrapper">
      <canvas id="canvas" width="1152" height="640" tabindex="-1">
        Your browser does not support the canvas tag.
      </canvas>
      <div id="loading">
        <span>LOADING</span>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
      </div>
      <button id="fullscreen-btn" title="Fullscreen">&#9974;</button>
    </div>
  </div>

  <footer>
    Made by <a href="https://github.com/Ayman-M-ElSaid">Ayman</a> ·
    <a href="https://github.com/Ayman-M-ElSaid/Pixel-Adventure">Source</a> ·
    <a href="https://github.com/Ayman-M-ElSaid/Pixel-Adventure/blob/main/CREDITS.md">Credits</a> ·
    Built with Godot Engine.
  </footer>

  <script src="index.js"></script>
  <script>
    const DESIGN_W = 1152, DESIGN_H = 640;
    const canvas = document.getElementById('canvas');
    const wrapper = document.getElementById('canvas-wrapper');
    const loading = document.getElementById('loading');
    const fill = document.getElementById('progress-fill');
    const fsBtn = document.getElementById('fullscreen-btn');

    function fitCanvas() {
      const isFull = !!document.fullscreenElement;
      const margin = isFull ? 0 : 24;
      const availW = window.innerWidth - margin;
      const availH = window.innerHeight - margin;
      let scale = Math.min(availW / DESIGN_W, availH / DESIGN_H);
      if (!isFull) scale = Math.min(scale, 1);
      canvas.style.width = (DESIGN_W * scale) + 'px';
      canvas.style.height = (DESIGN_H * scale) + 'px';
    }
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 300));
    fitCanvas();

    if (document.fullscreenEnabled) {
      fsBtn.style.display = 'flex';
      fsBtn.addEventListener('click', async () => {
        if (!document.fullscreenElement) {
          try {
            await wrapper.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => { });
            }
          } catch (e) { console.error(e); }
        } else {
          document.exitFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', () => {
        const isFull = !!document.fullscreenElement;
        fsBtn.textContent = isFull ? '\u2715' : '\u26F6';
        fsBtn.title = isFull ? 'Exit fullscreen' : 'Fullscreen';
        if (!isFull && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) { }
        }
        fitCanvas();
      });
    }

    const engine = new Engine({ "args": [], "canvasResizePolicy": 0, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": { "index.pck": 6830808, "index.wasm": 39509339 }, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4 });
    engine.startGame({
      onProgress: (current, total) => {
        if (total > 0) fill.style.width = Math.round(current / total * 100) + '%';
      }
    }).then(() => {
      loading.remove();
      canvas.focus();
    }).catch((err) => {
      console.error(err);
      loading.innerHTML = '<span style="color:#e06060;">Failed to load — see console</span>';
    });
  </script>
</body>

</html>
